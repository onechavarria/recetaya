# Nombre y puerto del microservicio
spring.application.name=msvc-dispensacion
server.port=8084

# Base de datos H2 independiente
spring.datasource.url=jdbc:h2:mem:dispensacionesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Persistencia JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Direcciones de los otros microservicios
servicios.usuario.url=http://localhost:8081
servicios.receta.url=http://localhost:8082
servicios.inventario.url=http://localhost:8083

