# Nombre y puerto del microservicio
spring.application.name=msvc-inventario
server.port=8083

# Conexion a la base de datos H2
spring.datasource.url=jdbc:h2:mem:inventariodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar la consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evitar mantener sesiones JPA abiertas en las respuestas
spring.jpa.open-in-view=false

